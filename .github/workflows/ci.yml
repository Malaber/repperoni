name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python_black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m invoke bootstrap-ci
      - run: python -m invoke black-check

  python_flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m invoke bootstrap-ci
      - run: python -m invoke flake8-check

  python_pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m invoke bootstrap-ci
      - run: python -m invoke test-python

  javascript_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m invoke bootstrap-ci
      - run: python -m invoke install-js
      - run: python -m invoke check-js

  browser_e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {device: [desktop, mobile]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m invoke bootstrap-ci
      - run: python -m invoke install-js
      - run: python -m invoke install-browser
      - run: python -m invoke browser-e2e-${{ matrix.device }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-${{ matrix.device }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 2

  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '${{ env.PYTHON_VERSION }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m invoke bootstrap-ci
      - run: python -m invoke check-locks
      - run: python -m invoke install-js
      - run: python -m invoke security-check

  docker_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=docker-test
          cache-to: type=gha,mode=max,scope=docker-test

  docker_platform:
    needs:
      [python_black, python_flake8, python_pytest, javascript_test, browser_e2e, security, docker_test]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, artifact_suffix: linux-amd64, runs_on: ubuntu-latest}
          - {platform: linux/arm64, artifact_suffix: linux-arm64, runs_on: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build isolated platform archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          build-args: |
            REPPERONI_VERSION=sha-${{ env.SOURCE_SHA }}
            REPPERONI_REVISION=${{ env.SOURCE_SHA }}
          tags: repperoni-build:${{ matrix.artifact_suffix }}
          outputs: type=docker,dest=/tmp/repperoni-${{ matrix.artifact_suffix }}.tar
          cache-from: type=gha,scope=docker-${{ matrix.artifact_suffix }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.artifact_suffix }}
      - run: docker load --input /tmp/repperoni-${{ matrix.artifact_suffix }}.tar
      - name: Reject known high-impact vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: repperoni-build:${{ matrix.artifact_suffix }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate platform SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: repperoni-build:${{ matrix.artifact_suffix }}
          format: spdx-json
          output-file: /tmp/repperoni-${{ matrix.artifact_suffix }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-image-${{ matrix.artifact_suffix }}
          path: |
            /tmp/repperoni-${{ matrix.artifact_suffix }}.tar
            /tmp/repperoni-${{ matrix.artifact_suffix }}.spdx.json
          if-no-files-found: error
          retention-days: 1
