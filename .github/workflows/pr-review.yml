name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.event.pull_request.head.sha }}'}
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=sha-$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "review_tag=pr-$PR_NUMBER-${PR_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "url=https://pr-$PR_NUMBER.pr.repperoni.malaber.de" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for tested image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.primary_tag }}
        run: |
          for attempt in $(seq 1 60); do
            docker buildx imagetools inspect "$IMAGE:$TAG" && exit 0
            echo "Waiting for $IMAGE:$TAG ($attempt/60)"
            sleep 10
          done
          exit 1
      - name: Create review tag
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE: ${{ steps.image.outputs.primary_tag }}
          TARGET: ${{ steps.image.outputs.review_tag }}
        run: docker buildx imagetools create --tag "$IMAGE:$TARGET" "$IMAGE:$SOURCE"
      - name: Wake review deployment
        id: wake
        env:
          WAKE_URL: ${{ vars.WEBHOOKER_REVIEW_WAKE_URL }}
          WAKE_SECRET: ${{ secrets.WEBHOOKER_WEBHOOK_SECRET }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          DELIVERY_ID: repperoni-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          if not os.environ["WAKE_URL"] or not os.environ["WAKE_SECRET"]:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write("triggered=false\n")
              raise SystemExit(0)
          owner, repo = os.environ["REPOSITORY"].split("/", 1)
          number = int(os.environ["PR_NUMBER"])
          payload = {"action": os.environ["EVENT_ACTION"], "number": number,
              "pull_request": {"number": number, "head": {"sha": os.environ["PR_HEAD_SHA"]}},
              "repository": {"name": repo, "full_name": os.environ["REPOSITORY"], "owner": {"login": owner}}}
          body = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
          signature = "sha256=" + hmac.new(os.environ["WAKE_SECRET"].encode(), body, hashlib.sha256).hexdigest()
          request = urllib.request.Request(os.environ["WAKE_URL"], data=body, method="POST", headers={
              "Content-Type": "application/json", "X-GitHub-Event": "pull_request",
              "X-GitHub-Delivery": os.environ["DELIVERY_ID"], "X-Hub-Signature-256": signature})
          with urllib.request.urlopen(request) as response:
              print(f"review wake status={response.status}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("triggered=true\n")
          PY
      - if: steps.wake.outputs.triggered == 'true'
        env: {REVIEW_URL: '${{ steps.image.outputs.url }}'}
        run: curl --fail --silent --show-error --retry 36 --retry-all-errors --retry-delay 10 "$REVIEW_URL/health"
      - uses: actions/setup-python@v6
        if: steps.wake.outputs.triggered == 'true'
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v6
        if: steps.wake.outputs.triggered == 'true'
        with: {node-version: '24'}
      - name: Verify deployed mobile flow
        if: steps.wake.outputs.triggered == 'true'
        env: {REVIEW_URL: '${{ steps.image.outputs.url }}'}
        run: |
          python -m pip install invoke
          python -m invoke bootstrap-ci
          python -m invoke install-js
          python -m invoke install-browser
          python -m invoke run-browser-e2e --base-url="$REVIEW_URL" --device=mobile
      - name: Comment verified URL
        if: steps.wake.outputs.triggered == 'true'
        uses: actions/github-script@v8
        env: {REVIEW_URL: '${{ steps.image.outputs.url }}'}
        with:
          script: |
            const marker = '<!-- repperoni-review-url -->';
            const body = `${marker}\nVerified review app: ${process.env.REVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
