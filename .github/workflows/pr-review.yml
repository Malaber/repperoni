name: PR Review

on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      image:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      revision:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  review_deploy:
    environment: review
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      triggered: ${{ steps.wake.outputs.triggered }}
      url: ${{ steps.image.outputs.url }}
    steps:
      - id: image
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: echo "url=https://pr-$PR_NUMBER.repperoni-review.malaber.de" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact image and trusted provenance
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          tag_digest="$(docker buildx imagetools inspect "$IMAGE:review-sha-$REVISION" |
            awk '/^Digest:/ {print $2; exit}')"
          [[ "$tag_digest" == "$DIGEST" ]]
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/publish.yml" \
            --source-ref refs/heads/main
      - if: always()
        run: docker logout ghcr.io
      - name: Wake isolated review deployment
        id: wake
        env:
          WAKE_URL: ${{ vars.WEBHOOKER_REVIEW_WAKE_URL }}
          WAKE_SECRET: ${{ secrets.WEBHOOKER_REVIEW_WEBHOOK_SECRET }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.revision }}
          REPOSITORY: ${{ github.repository }}
          DELIVERY_ID: repperoni-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -I - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          if not os.environ["WAKE_URL"] or not os.environ["WAKE_SECRET"]:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write("triggered=false\n")
              print("Review Webhooker environment is not configured; skipping deployment.")
              raise SystemExit(0)
          owner, repo = os.environ["REPOSITORY"].split("/", 1)
          number = int(os.environ["PR_NUMBER"])
          payload = {"action": "synchronize", "number": number,
              "pull_request": {"number": number, "head": {"sha": os.environ["PR_HEAD_SHA"]}},
              "repository": {"name": repo, "full_name": os.environ["REPOSITORY"],
                  "owner": {"login": owner}}}
          body = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
          signature = "sha256=" + hmac.new(
              os.environ["WAKE_SECRET"].encode(), body, hashlib.sha256
          ).hexdigest()
          request = urllib.request.Request(
              os.environ["WAKE_URL"],
              data=body,
              method="POST",
              headers={"Content-Type": "application/json", "X-GitHub-Event": "pull_request",
                  "X-GitHub-Delivery": os.environ["DELIVERY_ID"],
                  "X-Hub-Signature-256": signature},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"review wake status={response.status}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("triggered=true\n")
          PY
      - if: steps.wake.outputs.triggered == 'true'
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          REVIEW_URL: ${{ steps.image.outputs.url }}
        run: |
          response="$(curl --fail --silent --show-error --retry 36 \
            --retry-all-errors --retry-delay 10 "$REVIEW_URL/health/version")"
          jq -e --arg revision "$EXPECTED_REVISION" \
            '.status == "ok" and .revision == $revision' <<<"$response"

  deployed_e2e:
    needs: review_deploy
    if: needs.review_deploy.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24'}
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m invoke bootstrap-ci
      - run: python -m invoke install-js
      - run: python -m invoke install-browser
      - name: Verify deployed mobile flow
        env:
          REVIEW_URL: ${{ needs.review_deploy.outputs.url }}
        run: python -m invoke run-browser-e2e --base-url="$REVIEW_URL" --device=mobile
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-mobile-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 2

  comment:
    needs: [review_deploy, deployed_e2e]
    if: needs.review_deploy.outputs.triggered == 'true' && needs.deployed_e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_URL: ${{ needs.review_deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- repperoni-review-url -->';
            const body = `${marker}\nVerified review app: ${process.env.REVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(
              github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100}
            );
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: existing.id, body}
              );
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
