name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.event.workflow_run.head_sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.14'}
      - run: python -m pip install invoke
      - id: version
        env:
          REF_NAME: main
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: python -m invoke compute-version
      - id: image
        env: {REPOSITORY: '${{ github.repository }}'}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact tested image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE: sha-${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$SOURCE"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE:$SOURCE"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.git_tag }}
          VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          git tag "$TAG" "${{ github.event.workflow_run.head_sha }}"
          git push origin "$TAG"
          gh release create "$TAG" --title "Repperoni $VERSION" --generate-notes --target "${{ github.event.workflow_run.head_sha }}"
      - name: Wake production deployment
        env:
          WAKE_URL: ${{ vars.WEBHOOKER_PRODUCTION_WAKE_URL }}
          WAKE_SECRET: ${{ secrets.WEBHOOKER_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DELIVERY_ID: repperoni-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          if not os.environ["WAKE_URL"] or not os.environ["WAKE_SECRET"]:
              raise SystemExit(0)
          owner, repo = os.environ["REPOSITORY"].split("/", 1)
          payload = {"ref": "refs/heads/main", "after": os.environ["HEAD_SHA"],
              "repository": {"name": repo, "full_name": os.environ["REPOSITORY"], "owner": {"login": owner}}}
          body = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
          signature = "sha256=" + hmac.new(os.environ["WAKE_SECRET"].encode(), body, hashlib.sha256).hexdigest()
          request = urllib.request.Request(os.environ["WAKE_URL"], data=body, method="POST", headers={
              "Content-Type": "application/json", "X-GitHub-Event": "push",
              "X-GitHub-Delivery": os.environ["DELIVERY_ID"], "X-Hub-Signature-256": signature})
          with urllib.request.urlopen(request) as response:
              print(f"production wake status={response.status}")
          PY
