name: Release

on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      image:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: write
      packages: write
    steps:
      - name: Require exact protected main revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          current_revision="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_revision" == "$REVISION" ]]
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest="$(
            gh api --paginate "repos/$REPOSITORY/tags?per_page=100" --jq '.[].name' |
              sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' |
              sort -V |
              tail -n 1
          )"
          [[ -n "$latest" ]] || latest=0.1.0
          IFS=. read -r major minor patch <<<"$latest"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          while true; do
            patch=$((patch + 1))
            version="$major.$minor.$patch"
            if ! gh api "repos/$REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
              break
            fi
          done
          {
            echo "release_version=$version"
            echo "git_tag=v$version"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify provenance and promote exact digest
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag_digest="$(docker buildx imagetools inspect "$IMAGE:candidate-sha-$REVISION" |
            awk '/^Digest:/ {print $2; exit}')"
          [[ "$tag_digest" == "$DIGEST" ]]
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/publish.yml" \
            --source-ref refs/heads/main
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$REVISION" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
          promoted_digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" |
            awk '/^Digest:/ {print $2; exit}')"
          [[ "$promoted_digest" == "$DIGEST" ]]
          deployed_digest="$(docker buildx imagetools inspect "$IMAGE:sha-$REVISION" |
            awk '/^Digest:/ {print $2; exit}')"
          [[ "$deployed_digest" == "$DIGEST" ]]
      - if: always()
        run: docker logout ghcr.io
      - name: Wake production deployment
        env:
          WAKE_URL: ${{ vars.WEBHOOKER_PRODUCTION_WAKE_URL }}
          WAKE_SECRET: ${{ secrets.WEBHOOKER_PRODUCTION_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.revision }}
          DELIVERY_ID: repperoni-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -I - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          if not os.environ["WAKE_URL"] or not os.environ["WAKE_SECRET"]:
              raise SystemExit("Production Webhooker environment is required")
          owner, repo = os.environ["REPOSITORY"].split("/", 1)
          payload = {"ref": "refs/heads/main", "after": os.environ["HEAD_SHA"],
              "repository": {"name": repo, "full_name": os.environ["REPOSITORY"],
                  "owner": {"login": owner}}}
          body = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
          signature = "sha256=" + hmac.new(
              os.environ["WAKE_SECRET"].encode(), body, hashlib.sha256
          ).hexdigest()
          request = urllib.request.Request(
              os.environ["WAKE_URL"],
              data=body,
              method="POST",
              headers={"Content-Type": "application/json", "X-GitHub-Event": "push",
                  "X-GitHub-Delivery": os.environ["DELIVERY_ID"],
                  "X-Hub-Signature-256": signature},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"production wake status={response.status}")
          PY
      - name: Verify deployed revision
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          PRODUCTION_URL: https://repperoni.malaber.de
        run: |
          response="$(curl --fail --silent --show-error --retry 36 \
            --retry-all-errors --retry-delay 10 "$PRODUCTION_URL/health/version")"
          jq -e --arg revision "$EXPECTED_REVISION" \
            '.status == "ok" and .revision == $revision' <<<"$response"
      - name: Create immutable Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.revision }}
          TAG: ${{ steps.version.outputs.git_tag }}
        run: |
          if existing="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
            [[ "$existing" == "$RELEASE_SHA" ]]
          else
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$RELEASE_SHA"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.git_tag }}
          VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest --title "Repperoni $VERSION"
          else
            gh release create "$TAG" \
              --latest \
              --title "Repperoni $VERSION" \
              --generate-notes \
              --target "$RELEASE_SHA"
          fi
