project_id: repperoni-pr-review

github:
  owner: Malaber
  repo: repperoni
  token_env: GITHUB_TOKEN
  webhook_secret_env: GITHUB_WEBHOOK_SECRET
  required_event_types: [pull_request, ping]

deployment:
  mode: review
  compose_file: /srv/repperoni/deploy/compose.review.yml
  compose_bin: docker
  working_directory: /srv/repperoni/deploy
  hostname_template: pr-{pr}.repperoni-review.malaber.de
  project_name_prefix: repperoni-pr-
  preview_base_domain: repperoni-review.malaber.de

image:
  registry: ghcr.io
  repository: malaber/repperoni
  tag_template: sha-{sha}

preview:
  base_dir: /srv/repperoni/data/reviews
  data_dir_template: /srv/repperoni/data/reviews/pr-{pr}
  sqlite_path_template: /srv/repperoni/data/reviews/pr-{pr}/repperoni.db

reconcile:
  poll_interval_seconds: 60
  cleanup_closed_prs: true
  redeploy_on_sha_change: true

traefik:
  enable_labels: true
  certresolver: letsencrypt

state:
  state_file: /srv/repperoni/webhooker/runtime/state/repperoni-pr-review.json

wake:
  wake_file: /srv/repperoni/webhooker/runtime/wake/repperoni-pr-review
