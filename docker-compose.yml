services:
  app:
    build:
      context: .
      target: production
      args:
        REPPERONI_VERSION: local
    image: repperoni:local
    environment:
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: sqlite+aiosqlite:////data/repperoni.db
      SECRET_KEY: ${SECRET_KEY:-repperoni-local-compose-secret}
      WEBAUTHN_RP_ID: localhost
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
