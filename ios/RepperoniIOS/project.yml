name: RepperoniApp
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: VWKG94374J
targets:
  Repperoni:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - App
      - Assets.xcassets
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.repperoni
        PRODUCT_NAME: Repperoni
        MARKETING_VERSION: "$(inherited)"
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Repperoni
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: de.malaber.repperoni.auth
            CFBundleURLSchemes: [de.malaber.repperoni]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  RepperoniUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources: [UITests]
    dependencies:
      - target: Repperoni
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.repperoni.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Repperoni:
    build:
      targets:
        Repperoni: all
    test:
      targets: [RepperoniUITests]
